# Partesa S.R.L. supplier master list — XProject Phase 2 seed
#
# Source: invoice 5812120214 dated 2026-06-09 (€18,431.02 total),
# delivered to Sundance SRLS for the Sundance 2026 series.
#
# 31 items (excludes the "SPESE VARIE" admin charge from the invoice).
#
# Field definitions:
#   supplier_sku        : Partesa's internal "cod. articolo". Stable
#                         across invoices — the identity field.
#   item_name           : Full descriptive name as on the invoice.
#   category            : Coarse grouping for wizard accordion. Values:
#                         gin | vodka | whiskey | rum | tequila | mezcal
#                         aperitivo | premix | beer_keg | sparkling
#                         mixer | soft_drink | juice
#                         water_still | water_sparkling | equipment
#   default_unit        : Invoice UM. BO=bottle, KAR=carton, FS=keg,
#                         BM=canister.
#   units_per_pack      : How many drinkable units in one default_unit.
#                         1 for BO; 6/24/100 for KAR depending on inner
#                         pack size (extracted from item description).
#   volume_per_unit_ml  : Volume of ONE drinkable unit in ml. 1000 for
#                         1L bottle, 750 for 75cl, 30000 for a 30L keg.
#                         null for non-liquid items (CO2).
#   last_unit_price_eur : LIST price per default_unit (pre-discount).
#                         Discounts are line-specific and live on the
#                         per-event event_stock_items rows, not here.

