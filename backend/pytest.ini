# Pytest configuration for backend.
#
# Registered markers: prevents PytestUnknownMarkWarning on tests using them.
# Deselected by default: 'live' — tests that hit the real Slesh API. Run
#   them explicitly with `pytest -m live`.

[pytest]
asyncio_mode = strict
markers =
    live: integration tests that hit the real Slesh API (run manually with `pytest -m live`)
addopts = -m "not live"
